name: build

on:
  push:
  workflow_dispatch:

jobs:
  dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get android.jar
        run: |
          mkdir -p sdk
          curl -sSL -o sdk/android.jar https://raw.githubusercontent.com/Sable/android-platforms/master/android-33/android.jar
          ls -la sdk

      - name: Get d8
        run: |
          curl -sSL -o r8.jar https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.3.37/r8-8.3.37.jar
          ls -la r8.jar

      - name: Compile java
        run: |
          mkdir -p out
          javac -source 8 -target 8 -bootclasspath sdk/android.jar -d out java/Probe.java
          ls -la out

      - name: Dex
        run: |
          java -cp r8.jar com.android.tools.r8.D8 --min-api 33 --output out out/Probe.class
          ls -la out

      - name: Package
        run: |
          cd out
          cp classes.dex probe.dex
          sha256sum probe.dex > probe.dex.sha256
          cat probe.dex.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/probe.dex*