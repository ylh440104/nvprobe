name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get android.jar
        run: |
          mkdir -p sdk
          curl -sSL -o sdk/android.jar https://raw.githubusercontent.com/Sable/android-platforms/master/android-33/android.jar
          ls -la sdk

      - name: Get d8
        run: |
          curl -sSL -o r8.jar https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.3.37/r8-8.3.37.jar
          ls -la r8.jar

      - name: Get build-tools
        run: |
          curl -sSL -o bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q bt.zip
          ls -d android-* 

      - name: Compile
        run: |
          mkdir -p out
          javac -source 8 -target 8 -bootclasspath sdk/android.jar -d out apk/MainActivity.java
          java -cp r8.jar com.android.tools.r8.D8 --min-api 33 --output out $(find out -name '*.class')
          ls -la out

      - name: Build apk
        run: |
          BT=$(ls -d android-*/ | head -1)
          echo "build-tools: $BT"
          "$BT/aapt2" link -o unsign.apk \
            --manifest apk/AndroidManifest.xml \
            -I sdk/android.jar \
            --min-sdk-version 33 --target-sdk-version 33
          ls -la unsign.apk
          cd out
          cp classes.dex ../classes.dex
          cd ..
          zip -j unsign.apk classes.dex
          unzip -l unsign.apk

      - name: Sign
        run: |
          BT=$(ls -d android-*/ | head -1)
          keytool -genkeypair -keystore ks.jks -storepass 123456 -keypass 123456 \
            -alias k -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=t"
          "$BT/zipalign" -f 4 unsign.apk aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:123456 --key-pass pass:123456 \
            --out probe.apk aligned.apk
          "$BT/apksigner" verify --print-certs probe.apk || true
          ls -la probe.apk
          sha256sum probe.apk > probe.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            probe.apk
            probe.apk.sha256