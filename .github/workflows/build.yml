name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools and platform
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Build apk
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/34.0.0
          PLAT=$ANDROID_HOME/platforms/android-34/android.jar
          rm -rf out
          mkdir -p out/classes out/dex out/pkg
          javac -source 8 -target 8 -bootclasspath "$PLAT" -d out/classes apk/MainActivity.java
          $BT/d8 --min-api 33 --output out/dex $(find out/classes -name '*.class')
          cp out/dex/classes.dex out/pkg/classes.dex
          cd out/pkg
          $BT/aapt package -f -M ../../apk/AndroidManifest.xml -I "$PLAT" -F app.unaligned.apk
          zip -uj app.unaligned.apk classes.dex
          $BT/zipalign -f 4 app.unaligned.apk app.aligned.apk
          keytool -genkeypair -keystore ks.jks -storepass android -keypass android -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname CN=nvprobe
          $BT/apksigner sign --ks ks.jks --ks-pass pass:android --key-pass pass:android --out nvprobe.apk app.aligned.apk
          sha256sum nvprobe.apk > nvprobe.apk.sha256
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: nvprobe-apk
          path: |
            out/pkg/nvprobe.apk
            out/pkg/nvprobe.apk.sha256

  dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools and platform
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Build dex
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/34.0.0
          PLAT=$ANDROID_HOME/platforms/android-34/android.jar
          rm -rf out
          mkdir -p out/classes out/dex
          javac -source 8 -target 8 -bootclasspath "$PLAT" -d out/classes java/Probe.java
          $BT/d8 --min-api 33 --output out/dex $(find out/classes -name '*.class')
          cp out/dex/classes.dex out/probe.dex
          sha256sum out/probe.dex > out/probe.dex.sha256
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: probe-dex
          path: |
            out/probe.dex
            out/probe.dex.sha256
