name: build

on:
  push:
  workflow_dispatch:

jobs:
  dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Compile java
        run: |
          PLAT=$ANDROID_HOME/platforms/android-34/android.jar
          mkdir -p out
          javac -source 8 -target 8 -bootclasspath "$PLAT" -d out java/Probe.java

      - name: Dex
        run: |
          BT=$ANDROID_HOME/build-tools/34.0.0
          $BT/d8 --min-api 33 --output out out/Probe.class

      - name: Package
        run: |
          cd out
          ls -la
          cp classes.dex probe.dex
          sha256sum probe.dex > probe.dex.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/probe.dex*